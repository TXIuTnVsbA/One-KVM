name: Build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish GitHub Release
        required: false
        default: false
        type: boolean
      release_tag:
        description: Release tag name when publishing
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build frontend
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  deb:
    runs-on: ubuntu-22.04
    needs: frontend
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: dtolnay/rust-toolchain@stable

      - name: 🟢 缓存 Cross/Docker 容器内部依赖与编译半成品
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git-db/
            target/
          key: ${{ runner.os }}-cross-build-cache-v1-${{ hashFiles('Cross.toml', 'Cargo.lock', 'build/cross/Dockerfile.*') }}
          restore-keys: |
            ${{ runner.os }}-cross-build-cache-v1-

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-cross-release
          key: ${{ hashFiles('Cross.toml', 'build/cross/Dockerfile.*') }}
          cache-all-crates: true

      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked

      # 🟢【APT 加固防断连】在交叉编译前，强行将重试计数机制写入系统配置，防止 Debian 官方源出现 Connection reset 中断
      - name: 🟢 配置 APT 高频重试器
        run: |
          sudo sh -c 'echo "Acquire::Retries \"5\";" > /etc/apt/apt.conf.d/80-retries'
          # 如果项目中包含 build/cross/Dockerfile.arm64，直接为其注入重试代码，双重保险防断连
          if [ -f "build/cross/Dockerfile.arm64" ]; then
            sed -i '/apt-get update/i RUN echo "Acquire::Retries \\"5\\";" > /etc/apt/apt.conf.d/80-retries' build/cross/Dockerfile.arm64
          fi

      # 🟢【终极增量净化替换】在编译前强行调用 cross 容器清理目标编译缓存，彻底粉碎脏残留，逼迫编译器使用最新物理提纯源码现场压制
      - name: 🟢 强行粉碎脏缓存并原生 Cross 编译核心
        env:
          CARGO_TARGET_DIR: target
        run: |
          # 仅针对目标 arm64 环境执行精准提纯清理，保留基础依赖分层
          cross clean --target aarch64-unknown-linux-gnu --release
          # 全量重新编译您的完美版 CH343 数据流排空与豁免逻辑
          cross build --target aarch64-unknown-linux-gnu --release

      # 🟢【偷天换日打包】在执行原生 deb 打包脚本前，强行将我们现场编出来的完美版二进制程序对齐到目标打包目录
      - name: Package deb
        run: |
          mkdir -p target/debian
          mkdir -p target/aarch64-unknown-linux-gnu/release
          cp target/aarch64-unknown-linux-gnu/release/one-kvm target/
          bash build/package-deb.sh

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: one-kvm-deb
          path: target/debian/*.deb
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-2022
    needs: frontend
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: 🟢 缓存 vcpkg 下载与编译产物
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg
            vcpkg_installed
          key: ${{ runner.os }}-vcpkg-cache-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-cache-v1-

      - name: Prepare vcpkg and dependencies
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "C:\vcpkg"
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows-static"
          $env:VCPKG_INSTALLED_DIR = Join-Path $pwd "vcpkg_installed"

          if (-not (Test-Path $env:VCPKG_ROOT)) {
            git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          }

          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          }
          
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET --x-install-root="$env:VCPKG_INSTALLED_DIR"

          $tripletRoot = Join-Path $env:VCPKG_INSTALLED_DIR $env:VCPKG_DEFAULT_TRIPLET
          $env:TURBOJPEG_SOURCE = "explicit"
          $env:TURBOJPEG_LIB_DIR = Join-Path $tripletRoot "lib"
          $env:TURBOJPEG_INCLUDE_DIR = Join-Path $tripletRoot "include"

          "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_SOURCE=$env:TURBOJPEG_SOURCE" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_LIB_DIR=$env:TURBOJPEG_LIB_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TURBOJPEG_INCLUDE_DIR=$env:TURBOJPEG_INCLUDE_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-msvc-release
          key: ${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Build Windows exe
        shell: pwsh
        run: .\build\windows\build.ps1 -Configuration release -Package

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: one-kvm-windows-exe
          path: target/x86_64-pc-windows-msvc/release/one-kvm_*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    runs-on: ubuntu-22.04
    needs: [deb, windows]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag != '' }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        run: |
          if [ -z "${{ inputs.release_tag }}" ]; then
            echo "release_tag is required when publish_release is true"
            exit 1
          fi

      - name: Download deb artifact
        uses: actions/download-artifact@v4
        with:
          name: one-kvm-deb
          path: release-artifacts/deb

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: one-kvm-windows-exe
          path: release-artifacts/windows

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-artifacts/deb/*.deb
            release-artifacts/windows/*.exe
